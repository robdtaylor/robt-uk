<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#357abd"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a4a"/>
      <stop offset="100%" stop-color="#1e1e3a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#4a90d9" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="600" letter-spacing="0.5">MCP Attack Surface</text>
  <text x="400" y="50" text-anchor="middle" fill="#666" font-size="10" letter-spacing="2">WHAT MCPSEC SCANS FOR</text>

  <!-- Connection lines from center to servers (drawn first, behind everything) -->
  <!-- To Server 1 (top-left) -->
  <line x1="400" y1="230" x2="180" y2="140" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <!-- To Server 2 (top-right) -->
  <line x1="400" y1="230" x2="620" y2="140" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <!-- To Server 3 (bottom-left) -->
  <line x1="400" y1="280" x2="180" y2="370" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <!-- To Server 4 (bottom-center) -->
  <line x1="400" y1="290" x2="400" y2="370" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <!-- To Server 5 (bottom-right) -->
  <line x1="400" y1="280" x2="620" y2="370" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Protocol labels on lines -->
  <text x="270" y="178" text-anchor="middle" fill="#4a90d9" font-size="8" opacity="0.7" transform="rotate(-25, 270, 178)">stdio</text>
  <text x="530" y="178" text-anchor="middle" fill="#4a90d9" font-size="8" opacity="0.7" transform="rotate(25, 530, 178)">HTTP/SSE</text>
  <text x="270" y="338" text-anchor="middle" fill="#4a90d9" font-size="8" opacity="0.7" transform="rotate(25, 270, 338)">stdio</text>
  <text x="400" y="338" text-anchor="middle" fill="#4a90d9" font-size="8" opacity="0.7">stdio</text>
  <text x="530" y="338" text-anchor="middle" fill="#4a90d9" font-size="8" opacity="0.7" transform="rotate(-25, 530, 338)">HTTP/SSE</text>

  <!-- CENTER: AI App -->
  <g filter="url(#softGlow)">
    <rect x="330" y="220" width="140" height="60" rx="10" fill="url(#centerGrad)" stroke="#5a9fe6" stroke-width="1.5"/>
  </g>
  <rect x="330" y="220" width="140" height="60" rx="10" fill="url(#centerGrad)" stroke="#5a9fe6" stroke-width="1.5"/>
  <text x="400" y="247" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">AI App</text>
  <text x="400" y="265" text-anchor="middle" fill="#c0d8f0" font-size="9">Claude Desktop / Cursor</text>

  <!-- SERVER 1: Top-Left - Tool Poisoning -->
  <g>
    <rect x="110" y="100" width="140" height="50" rx="6" fill="url(#serverGrad)" stroke="#444" stroke-width="1"/>
    <rect x="110" y="100" width="140" height="4" rx="2" fill="#e74c3c" opacity="0.8"/>
    <text x="180" y="123" text-anchor="middle" fill="#ccc" font-size="10" font-weight="500">MCP Server</text>
    <text x="180" y="138" text-anchor="middle" fill="#888" font-size="8">filesystem</text>
  </g>
  <!-- Attack vector badge -->
  <g transform="translate(180, 80)">
    <rect x="-55" y="-12" width="110" height="20" rx="10" fill="#e74c3c" fill-opacity="0.15" stroke="#e74c3c" stroke-width="0.8"/>
    <circle cx="-42" cy="0" r="3" fill="#e74c3c"/>
    <text x="4" y="4" text-anchor="middle" fill="#e74c3c" font-size="9" font-weight="500">Tool Poisoning</text>
  </g>
  <text x="180" y="170" text-anchor="middle" fill="#666" font-size="7.5" font-style="italic">Hidden instructions in</text>
  <text x="180" y="181" text-anchor="middle" fill="#666" font-size="7.5" font-style="italic">tool descriptions</text>

  <!-- SERVER 2: Top-Right - Credential Exposure -->
  <g>
    <rect x="550" y="100" width="140" height="50" rx="6" fill="url(#serverGrad)" stroke="#444" stroke-width="1"/>
    <rect x="550" y="100" width="140" height="4" rx="2" fill="#e74c3c" opacity="0.8"/>
    <text x="620" y="123" text-anchor="middle" fill="#ccc" font-size="10" font-weight="500">MCP Server</text>
    <text x="620" y="138" text-anchor="middle" fill="#888" font-size="8">database</text>
  </g>
  <g transform="translate(620, 80)">
    <rect x="-65" y="-12" width="130" height="20" rx="10" fill="#e74c3c" fill-opacity="0.15" stroke="#e74c3c" stroke-width="0.8"/>
    <circle cx="-52" cy="0" r="3" fill="#e74c3c"/>
    <text x="4" y="4" text-anchor="middle" fill="#e74c3c" font-size="9" font-weight="500">Credential Exposure</text>
  </g>
  <text x="620" y="170" text-anchor="middle" fill="#666" font-size="7.5" font-style="italic">API keys leaked in</text>
  <text x="620" y="181" text-anchor="middle" fill="#666" font-size="7.5" font-style="italic">config files</text>

  <!-- SERVER 3: Bottom-Left - Prompt Injection -->
  <g>
    <rect x="70" y="360" width="140" height="50" rx="6" fill="url(#serverGrad)" stroke="#444" stroke-width="1"/>
    <rect x="70" y="360" width="140" height="4" rx="2" fill="#f39c12" opacity="0.8"/>
    <text x="140" y="383" text-anchor="middle" fill="#ccc" font-size="10" font-weight="500">MCP Server</text>
    <text x="140" y="398" text-anchor="middle" fill="#888" font-size="8">web-search</text>
  </g>
  <g transform="translate(140, 430)">
    <rect x="-60" y="-12" width="120" height="20" rx="10" fill="#f39c12" fill-opacity="0.15" stroke="#f39c12" stroke-width="0.8"/>
    <circle cx="-47" cy="0" r="3" fill="#f39c12"/>
    <text x="4" y="4" text-anchor="middle" fill="#f39c12" font-size="9" font-weight="500">Prompt Injection</text>
  </g>
  <text x="140" y="462" text-anchor="middle" fill="#666" font-size="7.5" font-style="italic">Via tool names and</text>
  <text x="140" y="473" text-anchor="middle" fill="#666" font-size="7.5" font-style="italic">descriptions</text>

  <!-- SERVER 4: Bottom-Center - SSRF Risk -->
  <g>
    <rect x="330" y="360" width="140" height="50" rx="6" fill="url(#serverGrad)" stroke="#444" stroke-width="1"/>
    <rect x="330" y="360" width="140" height="4" rx="2" fill="#f1c40f" opacity="0.8"/>
    <text x="400" y="383" text-anchor="middle" fill="#ccc" font-size="10" font-weight="500">MCP Server</text>
    <text x="400" y="398" text-anchor="middle" fill="#888" font-size="8">fetch</text>
  </g>
  <g transform="translate(400, 430)">
    <rect x="-40" y="-12" width="80" height="20" rx="10" fill="#f1c40f" fill-opacity="0.15" stroke="#f1c40f" stroke-width="0.8"/>
    <circle cx="-27" cy="0" r="3" fill="#f1c40f"/>
    <text x="4" y="4" text-anchor="middle" fill="#f1c40f" font-size="9" font-weight="500">SSRF Risk</text>
  </g>
  <text x="400" y="462" text-anchor="middle" fill="#666" font-size="7.5" font-style="italic">Servers accessing</text>
  <text x="400" y="473" text-anchor="middle" fill="#666" font-size="7.5" font-style="italic">internal networks</text>

  <!-- SERVER 5: Bottom-Right - Supply Chain -->
  <g>
    <rect x="590" y="360" width="140" height="50" rx="6" fill="url(#serverGrad)" stroke="#444" stroke-width="1"/>
    <rect x="590" y="360" width="140" height="4" rx="2" fill="#f39c12" opacity="0.8"/>
    <text x="660" y="383" text-anchor="middle" fill="#ccc" font-size="10" font-weight="500">MCP Server</text>
    <text x="660" y="398" text-anchor="middle" fill="#888" font-size="8">npx @unknown/pkg</text>
  </g>
  <g transform="translate(660, 430)">
    <rect x="-48" y="-12" width="96" height="20" rx="10" fill="#f39c12" fill-opacity="0.15" stroke="#f39c12" stroke-width="0.8"/>
    <circle cx="-35" cy="0" r="3" fill="#f39c12"/>
    <text x="4" y="4" text-anchor="middle" fill="#f39c12" font-size="9" font-weight="500">Supply Chain</text>
  </g>
  <text x="660" y="462" text-anchor="middle" fill="#666" font-size="7.5" font-style="italic">Unverified npx</text>
  <text x="660" y="473" text-anchor="middle" fill="#666" font-size="7.5" font-style="italic">packages</text>

  <!-- Legend -->
  <g transform="translate(30, 468)">
    <circle cx="8" cy="0" r="4" fill="#e74c3c"/>
    <text x="18" y="3" fill="#888" font-size="8">Critical</text>
    <circle cx="68" cy="0" r="4" fill="#f39c12"/>
    <text x="78" y="3" fill="#888" font-size="8">High</text>
    <circle cx="118" cy="0" r="4" fill="#f1c40f"/>
    <text x="128" y="3" fill="#888" font-size="8">Medium</text>
  </g>
</svg>